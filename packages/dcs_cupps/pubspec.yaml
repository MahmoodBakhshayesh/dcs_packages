name: dcs_cupps
description: Socket/XML CUPPS platform communication utilities for Flutter DCS applications.
version: 0.1.0
publish_to: none
repository: https://github.com/MahmoodBakhshayesh/dcs_packages
issue_tracker: https://github.com/MahmoodBakhshayesh/dcs_packages/issues
homepage: https://github.com/MahmoodBakhshayesh/dcs_packages/tree/main/packages/dcs_cupps
license: MIT

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dcs_common:
    git:
      url: https://github.com/MahmoodBakhshayesh/dcs_packages.git
      path: packages/dcs_common
      ref: main
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/icons/
    - assets/images/icons/bc/
    - assets/images/icons/be/
    - assets/images/icons/bg/
    - assets/images/icons/bp/
    - assets/images/icons/bt/
    - assets/images/icons/dd/
    - assets/images/icons/ms/
    - assets/images/icons/oc/
    - assets/images/icons/pr/
    - assets/images/icons/zi/
    - assets/images/icons/zl/
