name: dcs_zebra
description: Zebra Link-OS mobile/desktop printer client for Flutter DCS applications (TCP, Bluetooth, USB).
version: 0.1.0
publish_to: none
repository: https://github.com/MahmoodBakhshayesh/dcs_packages
issue_tracker: https://github.com/MahmoodBakhshayesh/dcs_packages/issues
homepage: https://github.com/MahmoodBakhshayesh/dcs_packages/tree/main/packages/dcs_zebra
license: MIT
topics:
  - zebra
  - printer
  - zpl
  - link-os
  - dcs

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dcs_common:
    git:
      url: https://github.com/MahmoodBakhshayesh/dcs_packages.git
      path: packages/dcs_common
      ref: main
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dcs.dcs_zebra
        pluginClass: DcsZebraPlugin
      ios:
        pluginClass: DcsZebraPlugin
      windows:
        pluginClass: DcsZebraPluginCApi
      macos:
        pluginClass: DcsZebraPlugin

  assets:
    - assets/images/icons/
    - assets/images/icons/bp/
    - assets/images/icons/bt/
